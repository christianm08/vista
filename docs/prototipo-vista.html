<title>Prototipo Vista</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: stile Vetro — superfici traslucide su aloni di colore, rail fluttuante su TV/desktop, barra a pillola fluttuante su telefono */
:root{
  --bg:#07090D; --bgrgb:7,9,13; --s1:rgba(255,255,255,.06); --s2:rgba(255,255,255,.09); --s3:rgba(255,255,255,.15); --line:rgba(255,255,255,.14);
  --solid:#10141B; --fg:#FFFFFF; --fg2:rgba(255,255,255,.74); --fg3:rgba(255,255,255,.58); --acc:#F6C59A; --on-acc:#0B0D12; --live:#C42B31; --ok:#4FD1A5;
  --glass:blur(24px) saturate(1.4);
  --display:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif; --body:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
.ambient{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.ambient span{position:absolute;border-radius:50%;filter:blur(90px)}
.ambient span:nth-child(1){width:420px;height:420px;top:-160px;left:-140px;background:#1E6B73;opacity:.6}
.ambient span:nth-child(2){width:360px;height:360px;top:38%;right:-170px;background:#E08A55;opacity:.38}
.ambient span:nth-child(3){width:400px;height:400px;bottom:-140px;left:-120px;background:#4B3A8C;opacity:.5}
.card,.livecard,.offer,.epg-scroll,.qrbox,.sync,.seg,.chip,.bnav,.rail,.topbar,.mg,.bgopt{-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass)}
.card,.livecard,.offer,.epg-scroll,.qrbox,.seg,.chip,.mg,.bgopt{border:1px solid var(--line)}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-0.02em}
.app{position:relative;z-index:1;display:flex;height:100%}

/* rail TV/desktop */
.rail{display:none;flex-direction:column;align-items:center;gap:8px;width:84px;flex:0 0 84px;height:calc(100% - 32px);margin:16px 0 16px max(16px,env(safe-area-inset-left,0px));padding:24px 0 20px;border-radius:34px;border:1px solid var(--line);background:rgba(22,26,34,.5)}
.mark{font:800 26px/1 var(--display);letter-spacing:-0.04em}
.mark i{font-style:normal;color:var(--acc)}
.rail .mark{margin-bottom:22px}
.rbtn{width:58px;height:58px;border-radius:29px;border:0;background:transparent;color:var(--fg2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:700;text-decoration:none}
.rbtn:hover{background:var(--s2);color:var(--fg)}
.rbtn[aria-current="page"]{background:#FFFFFF;color:#0B0D12}
.rail .grow{flex:1}

/* contenuto */
main{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(112px + env(safe-area-inset-bottom,0px));scroll-behavior:smooth}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;display:flex;align-items:center;justify-content:space-between;gap:12px;height:62px;margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px))) 4px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));background:rgba(var(--bgrgb),.5)}
.tright{display:flex;align-items:center;gap:6px}
.ibtn{width:44px;height:44px;border-radius:22px;border:0;background:transparent;color:var(--fg);display:inline-flex;align-items:center;justify-content:center}
.ibtn:hover{background:var(--s2)}
.sync{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:15px;background:var(--s2);font-size:12px;font-weight:600;color:var(--fg2);border:0}
.sync .dot{width:7px;height:7px;border-radius:50%;background:var(--fg3)}
.sync.on .dot{background:var(--ok)}
.sync.busy .dot{background:var(--acc);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
.desk-head{display:none}

.bnav{position:fixed;z-index:20;left:max(18px,env(safe-area-inset-left,0px));right:max(18px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));max-width:440px;margin:0 auto;height:66px;padding:0 9px;display:flex;align-items:center;justify-content:space-between;border-radius:33px;border:1px solid rgba(255,255,255,.18);background:rgba(22,26,34,.58);box-shadow:0 20px 40px rgba(0,0,0,.4)}
.bnav a{height:48px;min-width:48px;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:24px;font-size:14px;font-weight:700;color:rgba(255,255,255,.85);text-decoration:none}
.bnav a .lb{display:none}
.bnav a[aria-current="page"]{background:#FFFFFF;color:#0B0D12;padding:0 16px}
.bnav a[aria-current="page"] .lb{display:inline}

@media (min-width:900px){
  .rail{display:flex}
  .bnav,.topbar{display:none}
  main{padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(36px,env(safe-area-inset-right,0px));padding-block:28px 56px}
  .desk-head{display:flex;justify-content:flex-end;align-items:center;gap:10px;margin-bottom:18px}
}

/* elementi comuni */
.section{margin-top:28px}
.shead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.shead h2{font-size:20px;font-weight:700}
.shead .meta{font-size:13px;color:var(--fg2)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:46px;padding:0 18px;border-radius:23px;background:var(--s1);color:var(--fg2);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.chip[aria-pressed="true"]{background:#FFFFFF;color:#0B0D12;border-color:#FFFFFF}
.seg{display:inline-grid;grid-auto-flow:column;gap:4px;padding:4px;border-radius:23px;background:var(--s1)}
.seg button{height:36px;padding:0 18px;border:0;border-radius:18px;background:transparent;color:var(--fg2);font-size:14px;font-weight:600}
.seg button[aria-pressed="true"]{background:#FFFFFF;color:#0B0D12;font-weight:700}
.btn{height:50px;padding:0 22px;border-radius:25px;border:1px solid rgba(255,255,255,.2);font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:rgba(255,255,255,.13);color:var(--fg);text-decoration:none;-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass)}
.btn.pri{background:#FFFFFF;color:#0B0D12;border-color:#FFFFFF}
.btn.sm{height:40px;padding:0 16px;font-size:14px;border-radius:20px}
.btn:hover{filter:brightness(1.1)}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;background:rgba(255,255,255,.1);font-size:12px;font-weight:600;color:var(--fg)}
.tag.line{background:transparent;border:1px solid var(--line);color:var(--fg2)}
.tag.acc{background:transparent;border:1px solid var(--acc);color:var(--acc)}
.tag.live{background:var(--live);color:#fff;letter-spacing:.08em;font-size:11px}
.muted{color:var(--fg2)}
.small{font-size:13px}
.bar{height:3px;border-radius:2px;background:var(--s3);overflow:hidden}
.bar>span{display:block;height:100%;background:var(--acc)}
.card{background:var(--s1);border-radius:28px;padding:20px}
.empty{padding:28px;border-radius:24px;border:1px dashed var(--line);color:var(--fg2);text-align:center}
.proto{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--fg2);padding:4px 10px;border-radius:999px;border:1px solid var(--line)}

/* hero */
.greet{display:flex;flex-direction:column;gap:2px;margin:6px 0 16px}
.greet span{font-size:14px;font-weight:500;color:var(--fg2)}
.greet h1{font-size:clamp(27px,4vw,40px);font-weight:800}
.hero{position:relative;border-radius:34px;overflow:hidden;min-height:400px;background:#0F2C2D;display:flex;align-items:flex-end;box-shadow:0 30px 60px rgba(0,0,0,.45)}
.art{position:absolute;inset:0;background-size:cover}
.art span{position:absolute;border-radius:50%}
.hero .badge{position:absolute;top:14px;left:14px;z-index:1;padding:6px 12px;border-radius:14px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.14);-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);font-size:12px;font-weight:700}
.hero .in{position:relative;z-index:1;margin:12px;padding:18px;border-radius:26px;border:1px solid rgba(255,255,255,.2);background:rgba(16,22,28,.42);-webkit-backdrop-filter:blur(26px) saturate(1.4);backdrop-filter:blur(26px) saturate(1.4);display:flex;flex-direction:column;gap:10px;width:calc(100% - 24px);max-width:560px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.75)}
.hero h1{font-size:clamp(34px,6vw,64px);font-weight:800;line-height:1;letter-spacing:-0.03em}
.hero p{margin:0;color:rgba(255,255,255,.8);max-width:56ch}
.hero .in .row .btn.pri{flex:1 1 auto}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
@media (min-width:900px){
  .hero{min-height:460px;align-items:flex-end}
  .hero .in{margin:24px;padding:24px}
  .hero .in .row .btn.pri{flex:0 0 auto}
}

/* scaffali e poster */
.shelf{display:flex;gap:14px;overflow-x:auto;padding:8px 6px 16px;margin:0 -6px;scrollbar-width:none;scroll-snap-type:x proximity}
.shelf::-webkit-scrollbar{display:none}
.poster{position:relative;flex:0 0 var(--pw,128px);width:var(--pw,128px);max-width:100%;aspect-ratio:2/3;border-radius:20px;overflow:hidden;border:0;padding:0;text-align:left;color:#fff;background-size:cover;transition:transform .18s ease,box-shadow .18s ease;scroll-snap-align:start;box-shadow:0 12px 26px rgba(0,0,0,.35)}
.poster::after{content:"";position:absolute;inset:auto 0 0 0;height:55%;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.6))}
.poster:hover,.poster:focus-visible{transform:scale(1.05);outline:3px solid #FFFFFF;outline-offset:3px;box-shadow:0 18px 34px rgba(0,0,0,.55);z-index:1}
.poster .sh{position:absolute}
.poster .svc{position:absolute;z-index:1;top:8px;left:8px;padding:4px 8px;border-radius:10px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.16);-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass);font-size:10px;font-weight:700}
.poster .exp{position:absolute;z-index:1;top:8px;right:8px;padding:4px 7px;border-radius:10px;background:var(--acc);color:var(--on-acc);font-size:10px;font-weight:800}
.poster .pt{position:absolute;z-index:1;left:11px;right:11px;bottom:11px;font:800 16px/1.1 var(--display);letter-spacing:-0.01em}
.grid-posters{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:16px}
.grid-posters .poster{width:auto;flex:none}

/* in onda ora */
.livecard{flex:0 0 250px;max-width:100%;border-radius:24px;background:var(--s1);padding:0;overflow:hidden;text-align:left;color:var(--fg)}
.livecard:hover,.livecard:focus-visible{outline:3px solid #FFFFFF;outline-offset:2px}
.livecard .th{height:120px;position:relative;overflow:hidden;margin:6px 6px 0;border-radius:19px}
.livecard .th canvas{width:100%;height:100%;display:block}
.livecard .th .tag{position:absolute;top:10px;left:10px}
.livecard .bd{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.lc-top{display:flex;align-items:center;gap:10px}
.mono{flex:0 0 auto;width:40px;height:40px;border-radius:13px;display:flex;align-items:center;justify-content:center;font:800 11px/1 var(--display);color:#fff;letter-spacing:-0.02em}
.mono.lg{width:52px;height:52px;border-radius:14px;font-size:14px}
.clip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}

/* dettaglio */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:720px;max-height:92%;overflow-y:auto;background:var(--solid);border:1px solid var(--line);border-radius:34px 34px 0 0;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));box-shadow:0 -20px 60px rgba(0,0,0,.5)}
@media (min-width:900px){.scrim{align-items:center}.sheet{border-radius:34px;max-height:88%}}
.sheet .sart{position:relative;height:280px;overflow:hidden}
.sheet .sart::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(16,20,27,0) 35%,var(--solid) 97%)}
.sheet .x{position:absolute;top:14px;right:14px;z-index:2;background:rgba(0,0,0,.55)}
.sheet .body{padding:0 22px;margin-top:-70px;position:relative;z-index:1;display:flex;flex-direction:column;gap:12px}
.sheet h1{font-size:44px;font-weight:800;line-height:1}
.offer{display:flex;align-items:center;gap:12px;padding:12px;border-radius:22px;background:var(--s1);color:var(--fg);text-align:left;width:100%}
.offer:hover{background:var(--s2)}
.offer .ini{width:44px;height:44px;border-radius:14px;background:var(--s3);display:flex;align-items:center;justify-content:center;font:800 13px var(--display)}
.offer .tx{flex:1;min-width:0;display:flex;flex-direction:column}

/* live */
.live-wrap{display:grid;gap:18px}
@media (min-width:1100px){.live-wrap{grid-template-columns:minmax(0,1.7fr) minmax(320px,1fr)}}
.player{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:28px;overflow:hidden;background:#0E1218;box-shadow:0 24px 50px rgba(0,0,0,.4)}
.player canvas{width:100%;height:100%;display:block}
.player .ov{position:absolute;inset:auto 0 0 0;padding:16px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.78));display:flex;flex-direction:column;gap:6px}
.player .tl{position:absolute;top:12px;left:12px;display:flex;gap:8px;align-items:center}
.player .note{position:absolute;top:12px;right:12px;font-size:11px;color:#C9CDD4;background:rgba(0,0,0,.5);padding:4px 8px;border-radius:6px}
.qrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.qchip{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:transparent;color:var(--fg2);font-size:13px;font-weight:700}
.qchip[aria-pressed="true"]{border-color:#FFFFFF;color:#0B0D12;background:#FFFFFF}
.qchip.dead{text-decoration:line-through;opacity:.5}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--s2);scrollbar-width:none}
.tab{height:44px;padding:0 12px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--fg2);font-size:14px;font-weight:600;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--acc)}
.chlist{display:flex;flex-direction:column;gap:2px;margin-top:8px}
.chrow{display:flex;align-items:center;gap:12px;min-height:66px;padding:8px 10px;border-radius:20px;border:0;background:transparent;color:var(--fg);text-align:left;width:100%}
.chrow:hover{background:var(--s1)}
.chrow[aria-current="true"]{background:var(--s2)}
.chrow .n{width:24px;text-align:right;font-size:13px;color:var(--fg3);font-variant-numeric:tabular-nums}
.chrow .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.qb{font-size:10px;font-weight:800;padding:2px 5px;border-radius:4px;border:1px solid var(--line);color:var(--fg2)}
.star{width:40px;height:40px;border-radius:20px;border:0;background:transparent;color:var(--fg3);display:inline-flex;align-items:center;justify-content:center}
.star[aria-pressed="true"]{color:var(--acc)}

/* guida */
.epg-info{display:grid;gap:16px;align-items:start}
@media (min-width:900px){.epg-info{grid-template-columns:320px minmax(0,1fr)}}
.epg-scroll{overflow-x:auto;margin-top:18px;border-radius:28px;background:var(--s1);padding:10px 0 10px}
.epg{position:relative}
.epg-row{display:flex;align-items:center;height:64px}
.epg-ch{position:sticky;left:0;z-index:3;flex:0 0 170px;width:170px;height:100%;display:flex;align-items:center;gap:10px;padding:0 12px;background:rgba(14,17,23,.92);font-weight:600;font-size:14px}
.epg-track{position:relative;height:56px;flex:0 0 auto}
.prog{position:absolute;top:0;height:56px;border-radius:16px;border:0;padding:8px 12px;background:var(--s2);color:var(--fg);text-align:left;overflow:hidden;display:flex;flex-direction:column;justify-content:center;gap:2px}
.prog:hover{background:var(--s3)}
.prog.past{background:rgba(255,255,255,.035);color:var(--fg2)}
.prog.sel{outline:3px solid #FFFFFF;outline-offset:1px;background:var(--s3);color:#fff}
.prog .pt{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog .ps{font-size:12px;color:var(--fg2);white-space:nowrap}
.epg-times{display:flex;height:30px;align-items:center}
.epg-times .sp{position:sticky;left:0;z-index:3;flex:0 0 170px;height:100%;background:rgba(14,17,23,.92);padding:0 12px;display:flex;align-items:center;font-weight:700;font-family:var(--display)}
.nowline{position:absolute;top:0;bottom:0;width:2px;background:var(--acc);z-index:2;pointer-events:none}
.nowline::before{content:"";position:absolute;top:-2px;left:-5px;width:12px;height:12px;border-radius:6px;background:var(--acc)}

/* multiview */
.mv{display:grid;gap:8px;grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{position:relative;aspect-ratio:16/9;border-radius:24px;overflow:hidden;background:#0E1218;border:0;padding:0;color:#fff;text-align:left}
.tile canvas{width:100%;height:100%;display:block}
.tile.audio{outline:3px solid #FFFFFF;outline-offset:-3px}
.tile .cap{position:absolute;inset:auto 0 0 0;padding:10px 12px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.8));display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.tile .aud{position:absolute;top:10px;right:10px;display:inline-flex;gap:4px;align-items:center;padding:5px 10px;border-radius:12px;background:#FFFFFF;color:#0B0D12;font-size:12px;font-weight:700}
.mvsel{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));margin-top:16px}
.mvsel label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--fg2)}
select,input[type=text],input[type=email],input[type=password],input[type=search],textarea{background:var(--s2);border:1px solid var(--line);border-radius:16px;color:var(--fg);padding:0 12px;height:44px;width:100%}
textarea{height:auto;padding:12px;font:13px/1.5 ui-monospace,"SF Mono",Menlo,Consolas,monospace;resize:vertical}

/* cerca */
.search{position:relative}
.search input{height:56px;padding-left:50px;font-size:17px;border-radius:28px;-webkit-backdrop-filter:var(--glass);backdrop-filter:var(--glass)}
select option{background:var(--solid)}
.search svg{position:absolute;left:16px;top:16px;color:var(--fg2)}
.res-list{display:flex;flex-direction:column;gap:6px}

/* impostazioni */
.set-grid{display:grid;gap:18px}
@media (min-width:1100px){.set-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.set-grid .card h2{font-size:18px;margin-bottom:12px}
.sw-grid{display:grid;grid-template-columns:repeat(6,44px);gap:12px;justify-content:start}
.sw{width:44px;height:44px;border-radius:22px;border:0;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px #10141B,0 0 0 5px #FFFFFF}
.bgopts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.bgopt{border-radius:18px;background:var(--s2);padding:0;overflow:hidden;color:var(--fg);font-size:13px;font-weight:600}
.bgopt span{display:block;height:46px;border-bottom:1px solid var(--line)}
.bgopt b{display:block;padding:9px 0;font-weight:600}
.bgopt[aria-pressed="true"]{outline:2px solid var(--acc);outline-offset:2px}
.toggle{display:flex;align-items:center;gap:12px;min-height:52px;width:100%;border:0;background:transparent;color:var(--fg);padding:4px 0;text-align:left;font-size:15px}
.toggle .tx{flex:1}
.swt{width:48px;height:28px;border-radius:14px;background:#3A3F49;padding:3px;display:flex;flex:0 0 auto;transition:background .15s}
.swt i{width:22px;height:22px;border-radius:11px;background:#fff;transition:transform .15s}
.toggle[aria-checked="true"] .swt{background:#4FD1A5}
.toggle[aria-checked="true"] .swt i{transform:translateX(20px)}
.stat{display:flex;gap:18px;flex-wrap:wrap;margin:6px 0 12px}
.stat div{display:flex;flex-direction:column}

function parseM3U(text) {
  const lines = String(text).split(/\r?\n/);
  const out = { epgUrl: '', entries: [] };
  let cur = null;
  for (const raw of lines) {
    const line = raw.trim();
    if (!line) continue;
    if (line.startsWith('#EXTM3U')) {
      const m = line.match(/(?:x-tvg-url|url-tvg)="([^"]*)"/i);
      if (m) out.epgUrl = m[1];
    } else if (line.startsWith('#EXTINF')) {
      const attrs = {};
      line.replace(/([\w-]+)="([^"]*)"/g, (_, k, v) => { attrs[k.toLowerCase()] = v; return ''; });
      const ci = line.lastIndexOf(',');
      cur = { name: ci >= 0 ? line.slice(ci + 1).trim() : 'Senza nome', id: attrs['tvg-id'] || '', logo: attrs['tvg-logo'] || '', group: attrs['group-title'] || 'Altri' };
    } else if (!line.startsWith('#') && cur) {
      cur.url = line; out.entries.push(cur); cur = null;
    }
  }
  return out;
}

function normalize(name) {
  let n = String(name);
  n = n.replace(/^\s*[\[|(]?\s*(it|ita|italia)\s*[\]|):-]+\s*/i, '');
  let q = 'Auto';
  for (const Q of QUAL) { if (Q.re.test(n)) { q = Q.q; break; } }
  for (const Q of QUAL) n = n.replace(new RegExp(Q.re.source, 'gi'), ' ');
  n = n.replace(/\((backup|alt|bk|riserva)\)/gi, ' ').replace(/\b(backup|alt|h\.?265|hevc|50fps)\b/gi, ' ');
  n = n.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[|_]/g, ' ').replace(/\s+/g, ' ').trim();
  for (const [re, to] of ALIASES) n = n.replace(re, to);
  n = n.replace(/\s+/g, ' ').trim();
  return { key: n, q };
}

function displayName(key) {
  if (DISPLAY[key]) return DISPLAY[key];
  const UP = ['tv', 'tg', 'tgr', 'hd', 'mtv'];
  return key.split(' ').map((w) => UP.includes(w) ? w.toUpperCase() : w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}
function monogram(name) {
  const words = name.split(' ').filter(Boolean);
  if (words.length === 1) return (words[0].length <= 5 ? words[0] : words[0].slice(0, 3)).toUpperCase();
  return words.map((w) => /^[+\d]/.test(w) ? w : (w.length > 3 && !/\d/.test(w) ? w.slice(0, 2) : /\d/.test(w) ? w : w[0])).join('').toUpperCase().slice(0, 5);
}

function resolve(parsed) {
  const alias = {};
  const root = (k) => { while (alias[k]) k = alias[k]; return k; };
  const idKey = {};
  const prepared = parsed.entries.map((e) => ({ ...e, ...normalize(e.name) }));
  for (const e of prepared) {
    if (!e.id) continue;
    const base = e.id.split('@')[0].toLowerCase();
    const k = root(e.key);
    if (idKey[base] && root(idKey[base]) !== k) alias[k] = root(idKey[base]);
    else if (!idKey[base]) idKey[base] = k;
  }
  const groups = new Map();
  for (const e of prepared) {
    const k = root(e.key);
    if (!groups.has(k)) groups.set(k, { key: k, entries: [] });
    groups.get(k).entries.push(e);
  }
  const channels = [];
  let n = 1;
  for (const g of groups.values()) {
    const seen = new Set();
    const streams = [];
    for (const e of g.entries) {
      if (seen.has(e.url)) continue;
      seen.add(e.url);
      streams.push({ q: e.q, url: e.url, from: e.name, dead: false });
    }
    streams.sort((a, b) => QRANK[b.q] - QRANK[a.q]);
    const first = g.entries[0];
    const name = displayName(g.key);
    const hasId = g.entries.some((e) => e.id);
    const known = KNOWN.includes(g.key);
    const tone = TONES[hash(g.key) % TONES.length];
    channels.push({
      key: g.key, n: n++, name, mono: monogram(name), group: first.group,
      cat: GROUP_CAT[first.group] || 'mix', streams, sources: g.entries.map((e) => e.name),
      logoSrc: g.entries.some((e) => e.logo) ? 'lista' : (known ? 'tv-logos' : 'iniziali'),
      epg: hasId ? 'tvg-id' : (known ? 'nome' : ''),
      c1: tone[0], c2: tone[1]
    });
  }
  const report = {
    entries: parsed.entries.length,
    channels: channels.length,
    merged: channels.filter((c) => c.sources.length > 1).length,
    epg: channels.filter((c) => c.epg).length,
    logos: channels.filter((c) => c.logoSrc !== 'iniziali').length,
    epgUrl: parsed.epgUrl
  };
  return { channels, report };
}

const POOLS = {
  news: ['Telegiornale', 'Notiziario', 'Rassegna stampa', 'Meteo e notizie', 'Speciale attualità', 'Edizione della notte'],
  film: ['Film · La casa sul lago', 'Film · Notte a Torino', 'Film · Il ritorno', 'Film · Ultimo treno', 'Film · Estate al porto', 'Film · L’ospite'],
  serie: ['Distretto Nord', 'Medici di confine', 'Il commissario Ferri', 'Vite parallele', 'La pensione'],
  doc: ['Il respiro delle colline', 'Mari d’Italia', 'Città sotterranee', 'Il segreto delle api', 'Viaggio in Appennino', 'Officine'],
  ent: ['Gara di cucina', 'Quiz della sera', 'Talk show di attualità', 'Varietà del sabato', 'Cantieri di casa'],
  sport: ['Magazine sportivo', 'Pallavolo · Serie A', 'Ciclismo · Sintesi', 'Basket · Highlights', 'Notiziario sportivo']
};
const DESC = {
  news: 'Notizie dall’Italia e dal mondo, con collegamenti e approfondimenti.',
  film: 'Film in prima visione televisiva.',
  serie: 'Nuovo episodio della serie.',
  doc: 'Documentario tra natura, storia e territorio.',
  ent: 'Intrattenimento in diretta con ospiti in studio.',
  sport: 'Immagini, risultati e commenti della giornata sportiva.'
};
const EPG = {};
function buildEpg(ch) {
  if (!ch.epg) return [];
  if (EPG[ch.key]) return EPG[ch.key];
  const r = rng(hash(ch.key));
  const d = new Date(); d.setHours(5, 0, 0, 0);
  let t = d.getTime() - 30 * 60000 * Math.floor(r() * 3);
  const end = t + 26 * 3600000;
  const out = [];
  let last = '';
  while (t < end) {
    let cat = ch.cat;
    if (cat === 'mix') cat = ['news', 'film', 'serie', 'ent', 'doc'][Math.floor(r() * 5)];
    const pool = POOLS[cat];
    let title = pool[Math.floor(r() * pool.length)];
    if (title === last) title = pool[(pool.indexOf(title) + 1) % pool.length];
    last = title;
    const dur = (cat === 'film' ? [95, 110, 120] : cat === 'news' ? [20, 30, 45] : [30, 45, 60, 75])[Math.floor(r() * 3)];
    out.push({ s: t, e: t + dur * 60000, title, cat, desc: DESC[cat] });
    t += dur * 60000;
  }
  EPG[ch.key] = out;
  return out;
}
function nowNext(ch) {
  const list = buildEpg(ch); const now = Date.now();
  const i = list.findIndex((p) => p.s <= now && p.e > now);
  return { now: list[i] || null, next: list[i + 1] || null };
}
const progress = (p) => p ? Math.min(100, Math.max(0, ((Date.now() - p.s) / (p.e - p.s)) * 100)) : 0;

/* ---------- canvas animati (player simulato) ---------- */
let canvases = [];
const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function stopCanvases() { canvases = []; }
function mountCanvas(cv, ch, opts = {}) {
  if (!cv || !ch) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const size = () => { cv.width = Math.max(1, cv.clientWidth * dpr); cv.height = Math.max(1, cv.clientHeight * dpr); };
  size();

}
function drawCanvas(o, t) {
  const { cv, ch, opts, seed } = o;
  const ctx = cv.getContext('2d'); const w = cv.width, h = cv.height;
  if (!w || !h) return;
  ctx.fillStyle = ch.c1; ctx.fillRect(0, 0, w, h);
  const k = t / 1000;
  for (let i = 0; i < 3; i++) {
    const x = w * (0.25 + 0.5 * (0.5 + 0.5 * Math.sin(k * 0.18 * (i + 1) + seed + i * 2)));
    const y = h * (0.75 + 0.12 * Math.cos(k * 0.22 * (i + 1) + seed));
    const rad = h * (0.45 + i * 0.2);
    ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2);

  ctx.globalAlpha = 0.07; ctx.fillRect(0, h * 0.47, w, Math.max(1, h * 0.003));
  ctx.globalAlpha = 0.1;
  ctx.font = `800 ${Math.round(h * 0.34)}px Manrope, sans-serif`;
  ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(ch.mono, w * 0.95, h * 0.4);
  ctx.globalAlpha = 1;

    const d = new Date();
    ctx.font = `600 ${Math.round(h * 0.045)}px Inter, sans-serif`;
    ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.textAlign = 'right';
    ctx.fillText(pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()), w * 0.97, h * 0.93);

}
let last = 0;
function loop(t) {
  if (!reduce || t - last > 1000) {
    last = t;
    canvases = canvases.filter((o) => o.cv.isConnected);
    canvases.forEach((o) => drawCanvas(o, t));
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------- QR finto ---------- */
function drawQR(code) {
  const cv = $('#qr'); if (!cv) return;
  const ctx = cv.getContext('2d'); const r = rng(hash(code));
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 25, 25); ctx.fillStyle = '#000';
  for (let y = 1; y < 24; y++) for (let x = 1; x < 24; x++) if (r() > 0.52) ctx.fillRect(x, y, 1, 1);
  const finder = (x, y) => { ctx.fillStyle = '#000'; ctx.fillRect(x, y, 7, 7); ctx.fillStyle = '#fff'; ctx.fillRect(x + 1, y + 1, 5, 5); ctx.fillStyle = '#000'; ctx.fillRect(x + 2, y + 2, 3, 3); };
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 9, 9); ctx.fillRect(16, 0, 9, 9); ctx.fillRect(0, 16, 9, 9);
  finder(1, 1); finder(17, 1); finder(1, 17);
}

/* ---------- render ---------- */
const NAV_RAIL = [['cerca', 'search', 'Cerca'], ['home', 'home', 'Home'], ['live', 'live', 'Live'], ['guida', 'guide', 'Guida'], ['multiview', 'mv', 'Multi'], ['lista', 'list', 'Lista'], ['impostazioni', 'gear', 'Opzioni']];
const NAV_BOTTOM = [['home', 'home', 'Home'], ['live', 'live', 'Live'], ['guida', 'guide', 'Guida'], ['lista', 'list', 'Lista'], ['impostazioni', 'user', 'Profilo']];
function renderNav() {
  $('#rail').innerHTML = `<div class="mark">v<i>.</i></div>${NAV_RAIL.map(([v, i, l]) => `<a class="rbtn" href="#${v}" aria-current="${S.view === v ? 'page' : 'false'}">${ic(i)}<span>${l}</span></a>`).join('')}<div class="grow"></div>${syncPill()}`;
  $('#bnav').innerHTML = NAV_BOTTOM.map(([v, i, l]) => `<a href="#${v}" aria-label="${l}" aria-current="${S.view === v || (v === 'live' && S.view === 'multiview') ? 'page' : 'false'}">${ic(i, 21)}<span class="lb">${l}</span></a>`).join('');
}
function render(keepScroll) {
  const main = $('#main');
  const y = main.scrollTop;
  const oldSc = $('#epgScroll'); const sx = oldSc ? oldSc.scrollLeft : null;
  stopCanvases();
  const V = { home: viewHome, live: viewLive, guida: viewGuida, multiview: viewMultiview, cerca: viewCerca, lista: viewLista, impostazioni: viewImpostazioni };
  main.innerHTML = V[S.view]();
  renderNav(); paintSync();
  main.querySelectorAll('canvas[data-cv]').forEach((cv) => mountCanvas(cv, chByKey(cv.dataset.cv), { clock: !!cv.dataset.clock }));
  if (S.pairing) drawQR(S.pairing);
  if (keepScroll) { main.scrollTop = y; const sc = $('#epgScroll'); if (sc && sx != null) sc.scrollLeft = sx; }
  if (S.view === 'guida' && !keepScroll) {
    const sc = $('#epgScroll'); const nl = $('.nowline');
    if (sc && nl) sc.scrollLeft = Math.max(0, parseFloat(nl.style.left) - 170 - 80);
  }
  if (S.view === 'cerca' && !keepScroll) { const q = $('#q'); if (q) q.focus(); }
}
function go(v) { if (location.hash !== '#' + v) location.hash = v; else { S.view = v; render(); } }
function route() {
  const h = location.hash.replace('#', '');
  S.view = VIEWS.includes(h) ? h : 'home';
  closeDetail();
  render();
  $('#main').scrollTop = 0;
}
window.addEventListener('hashchange', route);

let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2600); }

/* ---------- azioni ---------- */
document.addEventListener('click', (e) => {
  const a = e.target.closest('[data-a]');
  if (!a) return;
  const act = a.dataset.a;
  if (act === 'close' && a.classList.contains('scrim') && e.target.closest('[data-stop]')) return;
  switch (act) {
    case 'nav': go(a.dataset.v); break;
    case 'open': openDetail(a.dataset.id); break;
    case 'close': closeDetail(); break;
    case 'deeplink': {
      const c = byId(a.dataset.id); const svc = a.dataset.svc;
      toast(`Si aprirebbe l’app ${svc} su “${c ? c.t : ''}”`);
      break;
    }
    case 'watch': {
      const id = a.dataset.id;
      if (S.watch.has(id)) { S.watch.delete(id); toast('Rimosso dalla tua lista'); } else { S.watch.add(id); toast('Aggiunto alla tua lista'); }
      persist();
      if ($('#modal').innerHTML) openDetail(id);
      render(true);
      break;
    }
    case 'filter': S.filter = a.dataset.f; render(true); break;
    case 'mineOnly': S.onlyMine = !S.onlyMine; render(true); break;
    case 'play': {
      S.cur = a.dataset.ch; S.sIdx = 0; S.auto = true;
      const ch = chByKey(S.cur); if (ch) ch.streams.forEach((s) => { s.dead = false; });
      persist();
      if (S.view === 'live') render(true); else go('live');
      break;
    }
    case 'replay': {
      S.cur = a.dataset.ch; persist(); toast('Replay: il provider deve supportare la visione in differita'); go('live'); break;
    }
    case 'fav': {
      const k = a.dataset.ch; const ch = chByKey(k);
      if (S.favs.has(k)) { S.favs.delete(k); toast(`${ch.name} rimosso dai preferiti`); } else { S.favs.add(k); toast(`${ch.name} aggiunto ai preferiti`); }
      persist(); render(true); break;
    }
    case 'group': S.liveGroup = a.dataset.g; render(true); break;
    case 'auto': S.auto = true; S.sIdx = Math.max(0, chByKey(S.cur).streams.findIndex((s) => !s.dead)); render(true); break;
    case 'q': S.auto = false; S.sIdx = +a.dataset.i; render(true); break;
    case 'freeze': {
      const ch = chByKey(S.cur); const curS = ch.streams[S.sIdx]; curS.dead = true;
      const nxt = ch.streams.findIndex((s) => !s.dead);
      if (nxt === -1) { ch.streams.forEach((s) => { s.dead = false; }); S.sIdx = 0; toast('Nessun flusso funzionante: si riprova dal primo'); }
      else { S.sIdx = nxt; S.auto = true; toast(`Flusso ${curS.q === 'Auto' ? 'principale' : curS.q} bloccato: passo a ${ch.streams[nxt].q === 'Auto' ? 'un altro flusso' : ch.streams[nxt].q}`); }
      render(true); break;
    }
    case 'epgsel': S.epgSel = { ch: a.dataset.ch, s: +a.dataset.s }; { const sc = $('#epgScroll'); const x = sc ? sc.scrollLeft : 0; render(true); const sc2 = $('#epgScroll'); if (sc2) sc2.scrollLeft = x; } break;
    case 'remind': {
      const k = a.dataset.k;
      if (S.reminders.has(k)) { S.reminders.delete(k); toast('Promemoria rimosso'); } else { S.reminders.add(k); toast(`Ti avviseremo quando inizia “${a.dataset.t}”`); }
      const sc = $('#epgScroll'); const x = sc ? sc.scrollLeft : 0; render(true); const sc2 = $('#epgScroll'); if (sc2) sc2.scrollLeft = x;
      break;
    }
    case 'mvaudio': S.mvAudio = +a.dataset.i; render(true); break;
    case 'qset': S.q = a.dataset.q; render(); { const q = $('#q'); if (q) { q.value = S.q; q.focus(); } } break;
    case 'acc': S.acc = +a.dataset.i; applyTheme(); persist(); render(true); break;
    case 'bgsel': S.bgi = +a.dataset.i; applyTheme(); persist(); render(true); break;
    case 'svc': { const s = a.dataset.s; if (S.mine.has(s)) S.mine.delete(s); else S.mine.add(s); persist(); render(true); break; }
    case 'importToggle': S.importOpen = !S.importOpen; render(true); break;
    case 'sample': S.listText = SAMPLE_M3U; Object.keys(EPG).forEach((k) => delete EPG[k]); loadList(S.listText); persist(); toast('Lista di esempio ripristinata'); render(true); break;
    case 'analyze': {
      const ta = $('#m3u'); const txt = ta ? ta.value : '';
      const parsed = parseM3U(txt);
      if (!parsed.entries.length) { toast('Non ho trovato canali: il testo deve contenere righe #EXTINF seguite da un indirizzo'); break; }
      S.listText = txt; Object.keys(EPG).forEach((k) => delete EPG[k]); loadList(txt); S.importOpen = false; S.epgSel = null; persist();
      toast(`${S.report.entries} voci → ${S.report.channels} canali, ${S.report.merged} raggruppati`);
      render(true); break;
    }
    case 'logout': S.account = null; S.pairing = null; persist(); toast('Disconnesso. Le impostazioni restano su questo dispositivo'); render(true); break;
    case 'pair': {
      const chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789'; const r = rng(Date.now() & 0xffffffff);
      let c = ''; for (let i = 0; i < 6; i++) c += chars[Math.floor(r() * chars.length)];
      S.pairing = c.slice(0, 3) + '-' + c.slice(3); render(true); break;
    }
    case 'unpair': S.pairing = null; render(true); break;
    case 'scan': {
      S.account.devices.push({ name: 'Android TV · Salotto', note: 'Collegata adesso tramite codice QR', icon: 'live' });
      S.pairing = null; persist(); toast('TV collegata: ritrova liste, preferiti e tema'); render(true); break;
    }
  }
});
document.addEventListener('submit', (e) => {
  if (e.target.id !== 'login') return;
  e.preventDefault();
  const em = $('#em').value.trim();
  S.account = { email: em, synced: Date.now(), devices: [{ name: 'Questo dispositivo', note: 'Browser', icon: 'user' }, { name: 'PC Windows', note: 'Ultimo accesso ieri', icon: 'gear' }] };
  persist(); toast('Accesso effettuato. Sincronizzazione attiva'); render(true);
});
document.addEventListener('input', (e) => {
  if (e.target.id === 'q') { S.q = e.target.value; const r = $('#results'); if (r) { r.innerHTML = searchResults(); r.querySelectorAll('canvas[data-cv]').forEach((cv) => mountCanvas(cv, chByKey(cv.dataset.cv))); } }
});
document.addEventListener('change', (e) => {
  const t = e.target;
  if (t.dataset && t.dataset.mv != null) { S.mv[+t.dataset.mv] = t.value; persist(); render(true); }
  if (t.id === 'file' && t.files && t.files[0]) {
    const fr = new FileReader();
    fr.onload = () => { const ta = $('#m3u'); if (ta) ta.value = String(fr.result); toast('File caricato: premi “Analizza e raggruppa”'); };
    fr.readAsText(t.files[0]);
  }
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('#modal').innerHTML) closeDetail(); });

/* aggiorna avanzamento dei programmi ogni minuto */
setInterval(() => { if (!$('#modal').innerHTML && document.activeElement && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'SELECT' && document.activeElement.tagName !== 'TEXTAREA') render(true); }, 60000);

applyTheme();
route();
})();
</script>
